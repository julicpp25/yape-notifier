name: Compilar APK y AAB Play Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar Keystore Oficial de Firma Release (si no existe)
        run: |
          if [ ! -f app/yapealdia-release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/yapealdia-release.jks \
              -alias yapealdia \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass YapeAlDia2026 \
              -keypass YapeAlDia2026 \
              -dname "CN=YapeAlDia, OU=ComercioPeru, O=YapeAlDia, L=Lima, ST=Lima, C=PE"
          fi

      - name: Instalar Plataforma Android API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK de Pruebas y AAB Oficial para Google Play
        run: gradle assembleDebug bundleRelease

      - name: Subir APK generado (Para probar en celular)
        uses: actions/upload-artifact@v4
        with:
          name: App-Yape-Notifier
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Subir AAB Oficial Firmado (Para subir a Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-YapeAlDia-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/yapealdia-release.jks
